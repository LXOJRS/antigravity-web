<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Alex Ojers</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        @font-face {
            font-family: 'Overused Grotesk';
            src: url('/fonts/OverusedGrotesk-VF.woff2') format('woff2-variations'),
                 url('/fonts/OverusedGrotesk-VF.woff2') format('woff2');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #121212;
            color: #fafafa;
            font-family: 'Overused Grotesk', 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        main {
            max-width: 640px;
        }

        h1 {
            font-size: clamp(3.5rem, 10vw, 8rem);
            font-weight: 800;
            line-height: 1;
            color: #BFE8F8;
            margin-bottom: 24px;
        }

        p {
            font-size: 1.25rem;
            line-height: 1.6;
            color: #B3B3B3;
            margin-bottom: 48px;
        }

        a {
            display: inline-block;
            color: #fafafa;
            text-decoration: none;
            font-size: 1rem;
            text-transform: uppercase;
            padding: 1rem 2rem;
            border: 1px solid #fafafa;
            border-radius: 50px;
            transition: background-color 0.3s, color 0.3s;
        }

        a:hover {
            background-color: #fafafa;
            color: #121212;
        }
    </style>
</head>

<body>
    <main>
        <h1>404</h1>
        <p>This page doesn't exist. The link may be old, or the page moved.</p>
        <a href="/">Back to home &rarr;</a>
    </main>
</body>

</html>
